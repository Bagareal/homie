# Checks that everything builds on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Interfaccia
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build ./cmd/homie

      - name: Script
        run: shellcheck install.sh scripts/setup.sh
